<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Portfolio Terminal</title>
    
    <!-- PWA & Mobile Meta Tags -->
    <meta name="theme-color" content="#111827">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Portfolio">

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen font-sans pb-12 select-none" x-data="portfolioApp()">

    <!-- Header -->
    <header class="bg-gray-800 border-b border-gray-700/80 sticky top-0 z-40 shadow-lg">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center gap-2">
            <h1 class="text-lg md:text-2xl font-bold tracking-wider text-emerald-400 flex items-center gap-2">
                <span>⚡</span> <span class="hidden sm:inline">Portfolio Terminal</span><span class="sm:hidden">Portfolio</span>
            </h1>
            
            <div class="flex items-center gap-3 bg-gray-900/80 px-3 py-1.5 rounded-xl border border-gray-700/60 text-xs sm:text-sm">
                <div>
                    <span class="text-gray-400 text-[10px] sm:text-xs block">Всего</span>
                    <span class="font-bold text-sm sm:text-base text-gray-100" x-text="formatCurrency(globalSummary.total_value, currentCurrency)"></span>
                </div>
                <div class="h-6 w-px bg-gray-700"></div>
                <div>
                    <span class="text-gray-400 text-[10px] sm:text-xs block">P&L</span>
                    <span class="font-bold text-sm sm:text-base" :class="globalSummary.total_pnl >= 0 ? 'text-emerald-400' : 'text-rose-400'" 
                          x-text="(globalSummary.total_pnl >= 0 ? '+' : '') + formatCurrency(globalSummary.total_pnl, currentCurrency)"></span>
                </div>
                <button @click="currentCurrency = currentCurrency === 'USD' ? 'AZN' : 'USD'" class="ml-1 px-2.5 py-1 bg-gray-700 hover:bg-gray-600 rounded-lg text-xs font-bold transition active:scale-95">
                    <span x-text="currentCurrency"></span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-3 sm:px-4 py-4 sm:py-6">
        
        <!-- Toolbar / Portfolio Selector -->
        <div class="flex flex-col sm:flex-row justify-between items-stretch sm:items-center gap-3 mb-6 bg-gray-800 p-3.5 sm:p-4 rounded-xl border border-gray-700/80 shadow-md">
            <div class="flex items-center gap-2 w-full sm:w-auto">
                <span class="text-gray-400 text-sm font-medium whitespace-nowrap">Портфель:</span>
                <select x-model.number="selectedPortfolioId" @change="changePortfolio()" class="bg-gray-900 border border-gray-600 rounded-lg px-3 py-2 text-white text-sm focus:outline-none focus:border-emerald-500 w-full sm:w-64">
                    <template x-for="p in portfolios" :key="p.id">
                        <option :value="p.id" x-text="p.name" :selected="p.id === selectedPortfolioId"></option>
                    </template>
                </select>
            </div>

            <div class="flex items-center gap-2 w-full sm:w-auto justify-end">
                <button @click="openCreateModal = true" class="flex-1 sm:flex-none px-3 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg font-medium transition active:scale-95 text-xs sm:text-sm text-center">
                    + Портфель
                </button>
                <button @click="openTradeModal = true" class="flex-1 sm:flex-none px-3 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-lg font-medium transition active:scale-95 text-xs sm:text-sm text-center" x-show="portfolios.length > 0">
                    + Сделка
                </button>
                <button @click="deleteCurrentPortfolio()" class="px-2.5 py-2 bg-rose-600/20 hover:bg-rose-600/40 text-rose-400 border border-rose-600/30 rounded-lg transition active:scale-95 text-xs" x-show="portfolios.length > 0" title="Удалить портфель">
                    🗑️
                </button>
            </div>
        </div>

        <template x-if="portfolios.length === 0">
            <div class="text-center py-16 bg-gray-800 rounded-xl border border-gray-700">
                <p class="text-gray-400 mb-4 text-sm">У вас пока нет ни одного портфеля.</p>
                <button @click="openCreateModal = true" class="px-5 py-2 bg-emerald-600 text-white rounded-lg text-sm">Создать первый портфель</button>
            </div>
        </template>

        <template x-if="portfolios.length > 0">
            <div class="space-y-6">
                
                <!-- Portfolio Metrics Grid -->
                <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4">
                    <div class="bg-gray-800 p-3.5 sm:p-5 rounded-xl border border-gray-700/80">
                        <span class="text-gray-400 text-xs block">Стоимость</span>
                        <div class="text-base sm:text-2xl font-bold mt-1 truncate" x-text="formatCurrency(currentData.total_value, currentCurrency)"></div>
                    </div>
                    <div class="bg-gray-800 p-3.5 sm:p-5 rounded-xl border border-gray-700/80">
                        <span class="text-gray-400 text-xs block">Прибыль / Убыток</span>
                        <div class="text-base sm:text-2xl font-bold mt-1 truncate" :class="currentData.total_pnl >= 0 ? 'text-emerald-400' : 'text-rose-400'"
                             x-text="(currentData.total_pnl >= 0 ? '+' : '') + formatCurrency(currentData.total_pnl, currentCurrency)"></div>
                        <div class="text-[10px] sm:text-xs" :class="currentData.total_pnl >= 0 ? 'text-emerald-400' : 'text-rose-400'" x-text="'(' + currentData.total_pnl_pct + '%)'"></div>
                    </div>
                    <div class="bg-gray-800 p-3.5 sm:p-5 rounded-xl border border-gray-700/80">
                        <span class="text-gray-400 text-xs block">Изм. за день</span>
                        <div class="text-base sm:text-2xl font-bold mt-1 truncate" :class="currentData.day_change >= 0 ? 'text-emerald-400' : 'text-rose-400'"
                             x-text="(currentData.day_change >= 0 ? '+' : '') + formatCurrency(currentData.day_change, currentCurrency)"></div>
                        <div class="text-[10px] sm:text-xs" :class="currentData.day_change >= 0 ? 'text-emerald-400' : 'text-rose-400'" x-text="'(' + currentData.day_change_pct + '%)'"></div>
                    </div>
                    <div class="bg-gray-800 p-3.5 sm:p-5 rounded-xl border border-gray-700/80">
                        <span class="text-gray-400 text-xs block">Вложено</span>
                        <div class="text-base sm:text-2xl font-bold mt-1 text-gray-200 truncate" x-text="formatCurrency(currentData.total_cost, currentCurrency)"></div>
                    </div>
                </div>

                <!-- Active Assets List -->
                <div class="bg-gray-800 rounded-xl border border-gray-700/80 overflow-hidden shadow-lg">
                    <div class="px-4 sm:px-6 py-3.5 border-b border-gray-700/80 flex justify-between items-center">
                        <h3 class="font-bold text-base sm:text-lg text-gray-200">Активы в портфеле</h3>
                        <span class="text-xs text-gray-400 sm:hidden">Прокрутите вправо →</span>
                    </div>
                    
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse min-w-[650px]">
                            <thead>
                                <tr class="bg-gray-900/60 text-gray-400 text-[11px] sm:text-xs uppercase tracking-wider border-b border-gray-700">
                                    <th class="px-4 py-3">Тикер</th>
                                    <th class="px-4 py-3">Кол-во</th>
                                    <th class="px-4 py-3">Ср. цена</th>
                                    <th class="px-4 py-3">Текущая</th>
                                    <th class="px-4 py-3">Стоимость</th>
                                    <th class="px-4 py-3">P&L</th>
                                    <th class="px-4 py-3">24h</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-gray-700/60 text-xs sm:text-sm">
                                <template x-for="pos in currentData.positions" :key="pos.ticker">
                                    <tr class="hover:bg-gray-750 transition">
                                        <td class="px-4 py-3 font-bold text-white" x-text="pos.ticker"></td>
                                        <td class="px-4 py-3 text-gray-200" x-text="pos.quantity"></td>
                                        <td class="px-4 py-3 text-gray-300" x-text="formatCurrency(pos.avg_price, currentCurrency)"></td>
                                        <td class="px-4 py-3 text-gray-300" x-text="formatCurrency(pos.current_price, currentCurrency)"></td>
                                        <td class="px-4 py-3 font-semibold text-white" x-text="formatCurrency(pos.current_value, currentCurrency)"></td>
                                        <td class="px-4 py-3 font-semibold" :class="pos.profit_loss >= 0 ? 'text-emerald-400' : 'text-rose-400'">
                                            <div x-text="(pos.profit_loss >= 0 ? '+' : '') + formatCurrency(pos.profit_loss, currentCurrency)"></div>
                                            <div class="text-[10px]" x-text="'(' + pos.profit_loss_pct + '%)'"></div>
                                        </td>
                                        <td class="px-4 py-3 font-semibold" :class="pos.day_change >= 0 ? 'text-emerald-400' : 'text-rose-400'">
                                            <div x-text="(pos.day_change >= 0 ? '+' : '') + formatCurrency(pos.day_change, currentCurrency)"></div>
                                            <div class="text-[10px]" x-text="'(' + pos.day_change_pct + '%)'"></div>
                                        </td>
                                    </tr>
                                </template>
                                <template x-if="!currentData.positions || currentData.positions.length === 0">
                                    <tr>
                                        <td colspan="7" class="px-4 py-8 text-center text-gray-500">В этом портфеле пока нет активов.</td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Trade History -->
                <div class="bg-gray-800 rounded-xl border border-gray-700/80 overflow-hidden shadow-lg">
                    <div class="px-4 sm:px-6 py-3.5 border-b border-gray-700/80">
                        <h3 class="font-bold text-base sm:text-lg text-gray-200">История сделок</h3>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse min-w-[600px]">
                            <thead>
                                <tr class="bg-gray-900/60 text-gray-400 text-[11px] sm:text-xs uppercase tracking-wider border-b border-gray-700">
                                    <th class="px-4 py-3">Дата</th>
                                    <th class="px-4 py-3">Тип</th>
                                    <th class="px-4 py-3">Тикер</th>
                                    <th class="px-4 py-3">Кол-во</th>
                                    <th class="px-4 py-3">Цена</th>
                                    <th class="px-4 py-3">Фикс. цена</th>
                                    <th class="px-4 py-3 text-right">Действия</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-gray-700/60 text-xs sm:text-sm">
                                <template x-for="t in currentData.trades" :key="t.id">
                                    <tr class="hover:bg-gray-750 transition">
                                        <td class="px-4 py-3 text-gray-400" x-text="t.date"></td>
                                        <td class="px-4 py-3">
                                            <span class="px-2 py-0.5 rounded text-[10px] font-bold" :class="t.trade_type === 'BUY' ? 'text-emerald-400 bg-emerald-950/60 border border-emerald-800/60' : 'text-rose-400 bg-rose-950/60 border border-rose-800/60'" x-text="t.trade_type"></span>
                                        </td>
                                        <td class="px-4 py-3 font-bold text-white" x-text="t.ticker"></td>
                                        <td class="px-4 py-3 text-gray-200" x-text="t.quantity"></td>
                                        <td class="px-4 py-3 text-gray-300" x-text="formatCurrency(t.price, currentCurrency)"></td>
                                        <td class="px-4 py-3 text-gray-400" x-text="t.manual_current_price ? formatCurrency(t.manual_current_price, currentCurrency) : '-'"></td>
                                        <td class="px-4 py-3 text-right space-x-1 sm:space-x-2">
                                            <button @click="startEditTrade(t)" class="text-amber-400 hover:text-amber-300 font-medium text-[11px] bg-amber-950/40 border border-amber-800/50 px-2 py-1 rounded">Изм.</button>
                                            <button @click="deleteTrade(t.id)" class="text-rose-400 hover:text-rose-300 font-medium text-[11px] bg-rose-950/40 border border-rose-800/50 px-2 py-1 rounded">Уд.</button>
                                        </td>
                                    </tr>
                                </template>
                                <template x-if="!currentData.trades || currentData.trades.length === 0">
                                    <tr>
                                        <td colspan="7" class="px-4 py-8 text-center text-gray-500">Сделки отсутствуют.</td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </template>
    </main>

    <!-- Modals -->
    <div x-show="openCreateModal" class="fixed inset-0 bg-black/75 flex items-center justify-center p-4 z-50" style="display: none;">
        <div class="bg-gray-800 border border-gray-700 rounded-xl max-w-md w-full p-5 sm:p-6 shadow-2xl" @click.away="openCreateModal = false">
            <h3 class="text-lg font-bold mb-4 text-white">Создать портфель</h3>
            <form @submit.prevent="createPortfolio">
                <div class="mb-3">
                    <label class="block text-gray-400 text-xs mb-1">Название</label>
                    <input type="text" x-model="newPortfolioName" required class="w-full bg-gray-900 border border-gray-600 rounded-lg px-3 py-2 text-white text-sm focus:outline-none focus:border-emerald-500">
                </div>
                <div class="mb-5">
                    <label class="block text-gray-400 text-xs mb-1">Описание</label>
                    <input type="text" x-model="newPortfolioDesc" class="w-full bg-gray-900 border border-gray-600 rounded-lg px-3 py-2 text-white text-sm focus:outline-none focus:border-emerald-500">
                </div>
                <div class="flex justify-end gap-2">
                    <button type="button" @click="openCreateModal = false" class="px-4 py-2 bg-gray-700 hover:bg-gray-600 rounded-lg text-xs font-medium">Отмена</button>
                    <button type="submit" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg text-xs font-medium">Создать</button>
                </div>
            </form>
        </div>
    </div>

    <div x-show="openTradeModal" class="fixed inset-0 bg-black/75 flex items-center justify-center p-4 z-50" style="display: none;">
        <div class="bg-gray-800 border border-gray-700 rounded-xl max-w-lg w-full p-5 sm:p-6 shadow-2xl" @click.away="closeTradeModal()">
            <h3 class="text-lg font-bold mb-4 text-white" x-text="editingTradeId ? 'Редактировать сделку' : 'Новая сделка'"></h3>
            <form @submit.prevent="saveTrade">
                <div class="grid grid-cols-2 gap-3 mb-3">
                    <div>
                        <label class="block text-gray-400 text-xs mb-1">Тикер (BTC, AAPL)</label>
                        <input type="text" x-model="tradeForm.ticker" required class="w-full bg-gray-900 border border-gray-600 rounded-lg px-3 py-2 text-white text-sm uppercase focus:outline-none focus:border-emerald-500">
                    </div>
                    <div>
                        <label class="block text-gray-400 text-xs mb-1">Тип сделки</label>
                        <select x-model="tradeForm.trade_type" class="w-full bg-gray-900 border border-gray-600 rounded-lg px-3 py-2 text-white text-sm focus:outline-none focus:border-emerald-500">
                            <option value="BUY">BUY (Покупка)</option>
                            <option value="SELL">SELL (Продажа)</option>
                        </select>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3 mb-3">
                    <div>
                        <label class="block text-gray-400 text-xs mb-1">Количество</label>
                        <input type="number" step="any" x-model.number="tradeForm.quantity" required class="w-full bg-gray-900 border border-gray-600 rounded-lg px-3 py-2 text-white text-sm focus:outline-none focus:border-emerald-500">
                    </div>
                    <div>
                        <label class="block text-gray-400 text-xs mb-1">Цена за единицу ($)</label>
                        <input type="number" step="any" x-model.number="tradeForm.price" required class="w-full bg-gray-900 border border-gray-600 rounded-lg px-3 py-2 text-white text-sm focus:outline-none focus:border-emerald-500">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3 mb-4">
                    <div>
                        <label class="block text-gray-400 text-xs mb-1">Фикс. цена (опционально)</label>
                        <input type="number" step="any" x-model.number="tradeForm.manual_current_price" placeholder="Авто" class="w-full bg-gray-900 border border-gray-600 rounded-lg px-3 py-2 text-white text-sm focus:outline-none focus:border-emerald-500">
                    </div>
                    <div>
                        <label class="block text-gray-400 text-xs mb-1">Дата</label>
                        <input type="date" x-model="tradeForm.trade_date" class="w-full bg-gray-900 border border-gray-600 rounded-lg px-3 py-2 text-white text-sm focus:outline-none focus:border-emerald-500">
                    </div>
                </div>
                <div class="flex justify-end gap-2 mt-5">
                    <button type="button" @click="closeTradeModal()" class="px-4 py-2 bg-gray-700 hover:bg-gray-600 rounded-lg text-xs font-medium">Отмена</button>
                    <button type="submit" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg text-xs font-medium" x-text="editingTradeId ? 'Сохранить' : 'Добавить'"></button>
                </div>
            </form>
        </div>
    </div>

    <script>
        function portfolioApp() {
            return {
                portfolios: [],
                selectedPortfolioId: null,
                currentData: { positions: [], trades: [], total_value: 0, total_cost: 0, total_pnl: 0, total_pnl_pct: 0, day_change: 0, day_change_pct: 0 },
                globalSummary: {},
                currentCurrency: 'USD',
                rate: 1.7,
                
                openCreateModal: false,
                newPortfolioName: '',
                newPortfolioDesc: '',

                openTradeModal: false,
                editingTradeId: null,
                tradeForm: { ticker: '', trade_type: 'BUY', quantity: '', price: '', manual_current_price: '', trade_date: '' },

                async init() {
                    try {
                        let res = await fetch('/api/portfolios_full');
                        let data = await res.json();
                        this.portfolios = data.portfolios || [];
                        this.globalSummary = data.global || {};
                        this.rate = data.rate || 1.7;

                        if (this.portfolios.length > 0) {
                            this.selectedPortfolioId = Number(this.portfolios[0].id);
                            this.updateCurrentPortfolioData();
                        }
                    } catch (e) {
                        console.error("Error loading portfolios:", e);
                    }
                },

                changePortfolio() {
                    this.updateCurrentPortfolioData();
                },

                updateCurrentPortfolioData() {
                    let p = this.portfolios.find(x => Number(x.id) === Number(this.selectedPortfolioId));
                    if (p) {
                        this.currentData = p.data;
                    }
                },

                formatCurrency(val, curr) {
                    if (val === undefined || val === null) return '$0.00';
                    let v = curr === 'AZN' ? val * this.rate : val;
                    let symbol = curr === 'AZN' ? '₼' : '$';
                    return symbol + Number(v).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
                },

                async createPortfolio() {
                    let formData = new FormData();
                    formData.append('name', this.newPortfolioName);
                    formData.append('description', this.newPortfolioDesc);
                    
                    await fetch('/create_portfolio', { method: 'POST', body: formData });
                    location.reload();
                },

                async deleteCurrentPortfolio() {
                    if (!confirm('Удалить этот портфель?')) return;
                    await fetch(`/delete_portfolio/${this.selectedPortfolioId}`, { method: 'POST' });
                    location.reload();
                },

                closeTradeModal() {
                    this.openTradeModal = false;
                    this.editingTradeId = null;
                    this.tradeForm = { ticker: '', trade_type: 'BUY', quantity: '', price: '', manual_current_price: '', trade_date: '' };
                },

                startEditTrade(t) {
                    this.editingTradeId = t.id;
                    this.tradeForm = {
                        ticker: t.ticker,
                        trade_type: t.trade_type,
                        quantity: t.quantity,
                        price: t.price,
                        manual_current_price: t.manual_current_price !== "" ? t.manual_current_price : '',
                        trade_date: t.date
                    };
                    this.openTradeModal = true;
                },

                async saveTrade() {
                    let formData = new FormData();
                    formData.append('portfolio_id', this.selectedPortfolioId);
                    formData.append('ticker', this.tradeForm.ticker);
                    formData.append('trade_type', this.tradeForm.trade_type);
                    formData.append('quantity', this.tradeForm.quantity);
                    formData.append('price', this.tradeForm.price);
                    if (this.tradeForm.manual_current_price) {
                        formData.append('manual_current_price', this.tradeForm.manual_current_price);
                    }
                    if (this.tradeForm.trade_date) {
                        formData.append('trade_date', this.tradeForm.trade_date);
                    }

                    let url = this.editingTradeId ? `/update_trade/${this.editingTradeId}` : '/add_trade';
                    await fetch(url, { method: 'POST', body: formData });
                    location.reload();
                },

                async deleteTrade(id) {
                    if (!confirm('Удалить эту сделку?')) return;
                    await fetch(`/delete_trade/${id}`, { method: 'POST' });
                    location.reload();
                }
            }
        }
    </script>
</body>
</html>
